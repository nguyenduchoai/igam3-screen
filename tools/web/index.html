<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGam3 Screen</title>
<style>
  :root {
    --bg: #0b0f1a; --card: #121a2b; --card2: #0f1624; --border: #22304a; --text: #e5e7eb; --sub: #94a3b8;
    --muted: #64748b; --accent: #22d3ee; --accent-ink: #062f38; --ok: #34d399; --warn: #fbbf24; --err: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
           padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--sub); }
  h2 { font-size: 15px; margin: 0 0 12px; letter-spacing: .2px; }
  h3 { font-size: 13px; margin: 18px 0 8px; color: var(--sub); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--sub); white-space: nowrap; }
  .pill.on { color: var(--ok); border-color: #1f5c47; }
  .pill.off { color: var(--warn); border-color: #5c4a1f; }
  .preview { position: relative; width: 100%; aspect-ratio: 3 / 2; background: #000; border-radius: 10px; overflow: hidden;
             border: 1px solid var(--border); }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: auto; }
  .preview .veil { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
                   background: rgba(5, 8, 15, .78); color: var(--sub); padding: 16px; }
  .preview.off .veil { display: flex; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .hint { color: var(--sub); font-size: 13px; margin: 8px 0 0; }
  .hint.warn { color: var(--warn); }
  .hint a { color: var(--accent); }
  code { background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 13px; word-break: break-all; }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; background: var(--card2); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .seg button { background: transparent; color: var(--sub); border: 0; border-radius: 9px; padding: 10px 6px; font: inherit; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  @media (max-width: 420px) { .seg button { font-size: 13px; padding: 10px 2px; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card2);
            border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: #334155; border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.field { display: block; margin: 10px 0 4px; color: var(--sub); font-size: 13px; }
  input[type=text], input[type=password], select { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 12px; font: inherit; }
  .picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; }
  .picker input[type=file] { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
  .picker label.btn { display: inline-block; }
  .picker input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fname { color: var(--sub); font-size: 13px; word-break: break-all; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--sub); font-size: 14px; }
  .splash-preview { margin-top: 12px; width: 100%; max-width: 480px; aspect-ratio: 3 / 2; border-radius: 10px; border: 1px solid var(--border); display: none; }
  .span2 { grid-column: 1 / -1; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(92vw, 560px); background: #1e293b;
           border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
           display: none; white-space: pre-line; font-size: 14px; z-index: 10; }
  #toast.err { border-color: #7f1d1d; color: #fecaca; }
  body.busy .btn, body.busy .seg button { pointer-events: none; opacity: .6; }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .gallery-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .gallery-bar .seg { grid-template-columns: repeat(2, auto); flex: none; }
  .gallery-bar .seg button { padding: 8px 12px; }
  .gallery-bar input[type=search] { flex: 1 1 180px; width: auto; background: var(--card2); color: var(--text); border: 1px solid var(--border);
            border-radius: 10px; padding: 9px 12px; font: inherit; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tcard { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tcard.current { border-color: var(--accent); }
  .thumb { aspect-ratio: 3 / 2; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
           color: var(--muted); font-size: 12px; text-align: center; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tname { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tmeta { color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tmeta a { color: var(--sub); }
  .tactions { display: flex; gap: 6px; margin-top: auto; }
  .tactions .btn { flex: 1; padding: 8px 6px; font-size: 13px; }
  .tactions .btn.ghost { flex: none; text-decoration: none; text-align: center; }
  .badge { font-size: 11px; color: var(--accent); border: 1px solid #155e6e; border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  .more { margin-top: 12px; }
  .places { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .vn { display: grid; grid-template-columns: minmax(0, 480px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .vn { grid-template-columns: 1fr; } }
  .vn-preview { width: 100%; aspect-ratio: 3 / 2; border-radius: 10px; border: 1px solid var(--border); background: #3a0a08; display: block; }
  .places .btn { font-weight: 600; }
  .inline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type=number], input[type=time] { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 12px; font: inherit; color-scheme: dark; }
  .alerts-now { color: var(--err); font-weight: 600; }
  .alerts-ok { color: var(--ok); }
  select.compact { width: auto; padding: 5px 10px; font-size: 13px; border-radius: 999px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1>iGam3 Screen <small id="subtitle" data-t="subtitle"></small></h1>
  <div class="head-right">
    <select id="language" class="compact" aria-label="Language / Ngôn ngữ">
      <option value="auto" data-t="langAuto"></option>
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
    </select>
    <span id="status" class="pill" data-t="loading"></span>
  </div>
</header>

<main>
  <section class="card">
    <h2 data-t="nowTitle"></h2>
    <div id="preview" class="preview">
      <img id="previewImg" src="/screen.png" data-t-alt="previewAlt">
      <div class="veil" id="veil" data-t="screenOff"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <span data-t="power"></span>
      <label class="switch"><input type="checkbox" id="power" data-t-label="power"><span></span></label>
    </div>
    <div class="row">
      <span data-t="autostart"></span>
      <label class="switch"><input type="checkbox" id="autostart" data-t-label="autostart"><span></span></label>
    </div>
  </section>

  <section class="card">
    <h2 data-t="mainTitle"></h2>
    <div class="seg" role="group" data-t-label="modeGroup">
      <button data-mode="stats" data-t="modeStats"></button>
      <button data-mode="clock" data-t="modeClock"></button>
      <button data-mode="vietnam" data-t="modeVietnam"></button>
      <button data-mode="image" data-t="modeImage"></button>
      <button data-mode="console" data-t="modeConsole"></button>
      <button data-mode="qr" data-t="modeQr"></button>
    </div>
    <p class="hint" id="modeHint"></p>
    <p class="hint warn" id="consoleWarn" hidden></p>

    <h3 data-t="display"></h3>
    <label class="field" for="brightness"><span data-t="brightness"></span>: <b id="brightnessValue"></b>%</label>
    <input type="range" id="brightness" min="0" max="100" step="5">
    <div class="row">
      <span data-t="rotate"></span>
      <label class="switch"><input type="checkbox" id="rotate" data-t-label="rotateLabel"><span></span></label>
    </div>
    <label class="field" for="theme" data-t="themeLabel"></label>
    <div style="display:flex;gap:8px">
      <select id="theme"></select>
      <button class="btn ghost" id="applyTheme" data-t="apply"></button>
    </div>
  </section>

  <section class="card span2">
    <h2 data-t="dashTitle"></h2>
    <p class="hint warn" id="themeWarn" hidden><span data-t="themeWarn"></span>
      <button class="btn ghost" id="useIgam3" style="margin-left:6px" data-t="useIgam3"></button></p>
    <h3 data-t="blocks"></h3>
    <div class="grid" id="blocks"></div>
    <h3 data-t="titleHead"></h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      <div><label class="field" for="title" data-t="bigText"></label><input type="text" id="title" maxlength="60"></div>
      <div><label class="field" for="tag" data-t="tagText"></label><input type="text" id="tag" maxlength="30"></div>
    </div>
    <div class="actions"><button class="btn" id="saveTitle" data-t="saveTitle"></button></div>
    <h3 data-t="bgHead"></h3>
    <div class="picker"><input type="file" id="bgFile" accept="image/*"><label class="btn ghost" for="bgFile" data-t="choose"></label><span class="fname" data-t="noFile"></span></div>
    <div class="actions">
      <button class="btn" id="setBg" data-t="setBg"></button>
      <button class="btn ghost" id="removeBg" data-t="removeBg"></button>
    </div>
    <p class="hint" id="bgHint"></p>
  </section>

  <section class="card span2" id="gallery">
    <h2 data-t="galleryTitle"></h2>
    <div class="gallery-bar">
      <div class="seg" role="group" data-t-label="galleryTitle">
        <button data-view="installed" id="viewInstalled"></button>
        <button data-view="store" id="viewStore"></button>
      </div>
      <input type="search" id="themeSearch" data-t-placeholder="searchThemes" data-t-label="searchThemes">
      <select id="themeOrient" class="compact" data-t-label="orientation">
        <option value="" data-t="orientAll"></option>
        <option value="landscape" data-t="landscapeCap"></option>
        <option value="portrait" data-t="portraitCap"></option>
      </select>
    </div>
    <p class="hint" id="galleryHint"></p>
    <div class="themes" id="themeGrid"></div>
    <div class="actions more"><button class="btn ghost" id="moreThemes" hidden></button></div>
  </section>

  <section class="card span2" id="vietnamCard">
    <h2>Vietnam Theme</h2>
    <div class="vn">
      <img id="vnPreview" class="vn-preview" data-t-alt="vnAlt">
      <div>
        <p class="hint" data-t="vnAbout"></p>
        <label class="field" for="vnLogo" data-t="vnLogo"></label>
        <div class="picker"><input type="file" id="vnLogo" accept="image/*"><label class="btn ghost" for="vnLogo" data-t="choose"></label><span class="fname" data-t="noFile"></span></div>
        <div class="actions">
          <button class="btn" id="vnUse" data-t="vnUse"></button>
          <button class="btn ghost" id="vnSetLogo" data-t="vnSetLogo"></button>
          <button class="btn ghost" id="vnNoLogo" data-t="vnNoLogo"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="card" id="clockCard">
    <h2 data-t="clockTitle"></h2>
    <p class="hint" id="cityNow"></p>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input type="text" id="citySearch" data-t-placeholder="citySearch" data-t-label="citySearch" maxlength="80">
      <button class="btn ghost" id="cityFind" data-t="search"></button>
    </div>
    <div class="places" id="places"></div>
    <div class="actions"><button class="btn ghost" id="cityOff" data-t="cityOff"></button></div>
    <p class="hint" data-t="weatherCredit"></p>
  </section>

  <section class="card" id="nightCard">
    <h2 data-t="nightTitle"></h2>
    <div class="row">
      <span data-t="nightOn"></span>
      <label class="switch"><input type="checkbox" id="nightOn" data-t-label="nightOn"><span></span></label>
    </div>
    <div class="inline">
      <div><label class="field" for="nightStart" data-t="from"></label><input type="time" id="nightStart"></div>
      <div><label class="field" for="nightEnd" data-t="to"></label><input type="time" id="nightEnd"></div>
    </div>
    <label class="field" for="nightAction" data-t="nightAction"></label>
    <select id="nightAction"><option value="dim" data-t="nightDim"></option><option value="off" data-t="nightOff"></option></select>
    <label class="field" for="nightLevel"><span data-t="nightLevel"></span>: <b id="nightLevelValue"></b>%</label>
    <input type="range" id="nightLevel" min="0" max="100" step="5">
    <div class="actions"><button class="btn" id="nightSave" data-t="save"></button></div>
    <p class="hint" data-t="nightHint"></p>
  </section>

  <section class="card span2" id="alertsCard">
    <h2 data-t="alertsTitle"></h2>
    <p class="hint" id="alertsNow"></p>
    <div class="row">
      <span data-t="alertsOn"></span>
      <label class="switch"><input type="checkbox" id="alertsOn" data-t-label="alertsOn"><span></span></label>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      <div><label class="field" for="alertTemp" data-t="alertTemp"></label><input type="number" id="alertTemp" min="0" max="110"></div>
      <div><label class="field" for="alertDisk" data-t="alertDisk"></label><input type="number" id="alertDisk" min="0" max="100"></div>
      <div><label class="field" for="alertServices" data-t="alertServices"></label><input type="text" id="alertServices" maxlength="200" placeholder="aicoworker.service"></div>
    </div>
    <div class="row">
      <span data-t="alertNet"></span>
      <label class="switch"><input type="checkbox" id="alertNet" data-t-label="alertNet"><span></span></label>
    </div>
    <div class="actions">
      <button class="btn" id="alertsSave" data-t="save"></button>
      <button class="btn ghost" id="alertsTest" data-t="alertTest"></button>
    </div>
    <p class="hint" data-t="alertsHint"></p>
    <h3 data-t="telegramTitle"></h3>
    <p class="hint" id="telegramStatus"></p>
    <div id="telegramSetup">
      <p class="hint" data-t-html="telegramSteps"></p>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:8px">
        <div><label class="field" for="botToken" data-t="botTokenLabel"></label>
          <input type="password" id="botToken" data-t-placeholder="botToken" autocomplete="off"></div>
        <div><label class="field" for="chatId" data-t="chatIdLabel"></label>
          <input type="text" id="chatId" data-t-placeholder="chatId" maxlength="40" autocomplete="off"></div>
      </div>
      <div class="actions"><button class="btn" id="telegramConnect" data-t="connect"></button></div>
    </div>
    <div class="actions" id="telegramActions">
      <button class="btn ghost" id="telegramTest" data-t="telegramTest"></button>
      <button class="btn ghost" id="telegramOff" data-t="telegramOff"></button>
    </div>
  </section>

  <section class="card">
    <h2 data-t="yourPicture"></h2>
    <div class="picker"><input type="file" id="imageFile" accept="image/*"><label class="btn ghost" for="imageFile" data-t="choose"></label><span class="fname" data-t="noFile"></span></div>
    <label class="check"><input type="checkbox" id="fill"> <span data-t="fill"></span></label>
    <div class="actions"><button class="btn" id="keepImage" data-t="useAsMain"></button></div>
    <p class="hint" data-t="pictureHint"></p>
  </section>

  <section class="card">
    <h2 data-t="splashHead"></h2>
    <label class="field" for="sTitle" data-t="sTitle"></label><input type="text" id="sTitle" value="iGam3 M1" maxlength="80">
    <label class="field" for="sSub" data-t="sSub"></label><input type="text" id="sSub" value="DePIN Edge AI Node" maxlength="100">
    <label class="field" for="sFooter" data-t="sFooter"></label><input type="text" id="sFooter" maxlength="100">
    <label class="field" for="logoFile" data-t="logo"></label>
    <div class="picker"><input type="file" id="logoFile" accept="image/*"><label class="btn ghost" for="logoFile" data-t="choose"></label><span class="fname" data-t="noFile"></span></div>
    <label class="field" for="photoFile" data-t="photo"></label>
    <div class="picker"><input type="file" id="photoFile" accept="image/*"><label class="btn ghost" for="photoFile" data-t="choose"></label><span class="fname" data-t="noFile"></span></div>
    <div class="actions">
      <button class="btn ghost" id="previewSplash" data-t="preview"></button>
      <button class="btn" id="keepSplash" data-t="useAsMain"></button>
    </div>
    <img id="splashImg" class="splash-preview" data-t-alt="splashAlt">
  </section>

  <section class="card span2">
    <h2 data-t="phoneHead"></h2>
    <p class="hint" id="lanHint"></p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      <div><label class="field" for="pw1" data-t="pw1"></label><input type="password" id="pw1" autocomplete="new-password"></div>
      <div><label class="field" for="pw2" data-t="pw2"></label><input type="password" id="pw2" autocomplete="new-password"></div>
    </div>
    <div class="actions">
      <button class="btn" id="savePw" data-t="savePw"></button>
      <button class="btn ghost" id="qrNow" data-t="qrNow"></button>
    </div>
    <p class="hint" id="shortcutHint" data-t-html="keysLinux"></p>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null, textsLoaded = false, toastTimer = null;

// Texts as [Vietnamese, English]. The server puts the language of the machine in <html lang>
const VI = document.documentElement.lang === "vi";
const TEXT = {
  loading: ["Đang tải…", "Loading…"],
  running: ["Đang chạy", "Running"],
  stopped: ["Đã tắt", "Off"],
  disconnected: ["Mất kết nối", "Disconnected"],
  subtitle: ['Màn hình 3.5" của máy iGam3', 'The 3.5" screen of the iGam3'],
  subtitleLive: ['Màn hình 3.5" · {0}', '3.5" screen · {0}'],
  langAuto: ["Tự động (theo máy)", "Automatic (system)"],
  nowTitle: ["Màn hình nhỏ lúc này", "The small screen right now"],
  previewAlt: ["Hình đang hiện trên màn 3.5 inch", "What the 3.5 inch screen shows"],
  screenOff: ["Màn hình đang tắt", "The screen is off"],
  noAccess: ["Chưa có quyền dùng màn hình", "No permission to use the screen"],
  noDevice: ["Không thấy màn hình USB", "USB screen not found"],
  power: ["Bật màn hình", "Screen on"],
  autostart: ["Tự bật khi khởi động máy", "Start at boot"],
  mainTitle: ["Màn hình chính", "Main screen"],
  modeGroup: ["Chọn màn hình chính", "Choose the main screen"],
  modeStats: ["Thông số", "Dashboard"],
  modeImage: ["Ảnh", "Picture"],
  modeConsole: ["Dòng lệnh", "Console"],
  modeQr: ["Mã QR", "QR code"],
  hint_stats: ["Hiện CPU, RAM, SSD, mạng, giờ… Bật/tắt từng khối ở mục Bảng thông số.",
               "Shows CPU, RAM, SSD, network, time… Turn each block on or off under Dashboard."],

function t(key, ...args) {
  let text = TEXT[key][VI ? 0 : 1];
  args.forEach((arg, i) => (text = text.replaceAll(`{${i}}`, arg)));
  return text;
}
const esc = (text) => String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
document.querySelectorAll("[data-t-html]").forEach((el) => (el.innerHTML = t(el.dataset.tHtml)));
document.querySelectorAll("[data-t-label]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.tLabel)));
document.querySelectorAll("[data-t-alt]").forEach((el) => (el.alt = t(el.dataset.tAlt)));
document.querySelectorAll("[data-t-placeholder]").forEach((el) => (el.placeholder = t(el.dataset.tPlaceholder)));
document.querySelectorAll(".picker input").forEach((input) => input.addEventListener("change", () => {
  input.parentElement.querySelector(".fname").textContent = input.files[0] ? input.files[0].name : t("noFile");
}));

function toast(message, ok = true) {
  const box = $("toast");
  box.textContent = message;
  box.className = ok ? "" : "err";
  box.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (box.style.display = "none"), ok ? 3500 : 8000);
}

async function action(payload, doneMessage) {
  document.body.classList.add("busy");
  toast(t("applying"));
  try {
    const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json", "X-Igam3": "1" }, body: JSON.stringify(payload) });
    const res = await r.json();
    toast(res.ok ? (doneMessage || res.message || t("done")) : (res.message || t("failed")), res.ok);
    return res.ok;
  } catch (e) {
    toast(t("unreachable", e.message), false);
    return false;
  } finally {
    document.body.classList.remove("busy");
    refresh();
    setTimeout(refreshPreview, 4000);
  }
}

async function upload(slot, input) {
  const file = input.files[0];
  if (!file) { toast(t("noFile"), false); return false; }
  const r = await fetch(`/api/upload?slot=${slot}&name=${encodeURIComponent(file.name)}`, { method: "POST", headers: { "X-Igam3": "1" }, body: file });
  const res = await r.json();
  if (!res.ok) toast(res.message, false);
  return res.ok;
}

function render(s) {
  state = s;
  const windows = s.platform === "windows";  // no text console mode on Windows
  document.querySelector('.seg button[data-mode="console"]').style.display = windows ? "none" : "";
  if (windows) $("shortcutHint").innerHTML = t("keysWindows");
  if (document.activeElement !== $("language")) $("language").value = s.language_setting;
  const running = s.service.state === "active";
  $("status").textContent = t(running ? "running" : "stopped");
  $("status").className = "pill " + (running ? "on" : "off");
  $("subtitle").textContent = t("subtitleLive", s.hostname + (s.ip ? " · " + s.ip : ""));
  $("preview").classList.toggle("off", !running);
  $("veil").textContent = t(s.device.port ? (s.device.access ? "screenOff" : "noAccess") : "noDevice");
  $("power").checked = running;
  $("autostart").checked = s.service.autostart;
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === s.mode)));
  $("modeHint").textContent = t("hint_" + s.mode) + (s.mode === "image" && s.image ? t("imageName", s.image) : "");
  $("consoleWarn").hidden = !(s.mode === "console" && !s.console.allowed);
  $("consoleWarn").innerHTML = t("consoleWarn", esc(s.console.setup));
  if (document.activeElement !== $("brightness")) { $("brightness").value = s.brightness; $("brightnessValue").textContent = s.brightness; }
  $("rotate").checked = s.reverse;
  const sel = $("theme");
  if (sel.options.length !== s.themes.length) {
    sel.innerHTML = "";
    s.themes.forEach((th) => sel.add(new Option(`${th.name} (${t(th.orientation === "landscape" ? "landscape" : "portrait")})`, th.name)));
  }
  if (document.activeElement !== sel) sel.value = s.theme;
  $("themeWarn").hidden = s.theme === "iGam3";
  const box = $("blocks");
  if (!box.children.length) {
    s.blocks.forEach((b) => {
      const el = document.createElement("label");
      el.className = "toggle";
      el.innerHTML = `<span>${esc(b.label)}</span><span class="switch"><input type="checkbox" data-block="${esc(b.key)}"><span></span></span>`;
      box.appendChild(el);
    });
    box.querySelectorAll("input").forEach((i) => i.addEventListener("change", () => action({ action: "blocks", blocks: { [i.dataset.block]: i.checked } })));
  }
  s.blocks.forEach((b) => { box.querySelector(`[data-block="${b.key}"]`).checked = b.on; });
  if (!textsLoaded) { $("title").value = s.title; $("tag").value = s.tag; textsLoaded = true; }
  $("bgHint").textContent = t(s.background ? "bgOwn" : "bgDefault");
  $("lanHint").innerHTML = s.web.lan ? t("lanOn", esc(`http://${s.ip}:${s.web.port}`)) : t("lanOff");
  renderSettings(s);
}

let settingsLoaded = false;
function renderSettings(s) {
  if (!s.weather || !s.alerts || !s.night || !s.telegram) return;  // older server
  $("cityNow").textContent = s.weather.name ? t("cityNow", s.weather.name) : t("cityNone");
  const a = s.alerts, n = s.night;
  const now = $("alertsNow");
  now.className = "hint " + (a.active.length ? "alerts-now" : "alerts-ok");
  now.textContent = !a.enabled ? t("alertsOffNow") : a.active.length ? t("alertsNow", a.active.map((x) => x.text).join("; ")) : t("alertsOk");
  $("telegramStatus").textContent = s.telegram.connected ? t("telegramConnected", s.telegram.bot, s.telegram.chat || "?")
    : s.telegram.token_saved ? t("telegramTokenSaved") : t("telegramNone");
  $("telegramSetup").hidden = s.telegram.connected;
  $("telegramActions").hidden = !s.telegram.connected;
  if (settingsLoaded) return;  // do not overwrite what is being typed
  settingsLoaded = true;
  $("alertsOn").checked = a.enabled;
  $("alertTemp").value = a.temperature;
  $("alertDisk").value = a.disk;
  $("alertNet").checked = a.network;
  $("alertServices").value = (a.services || []).join(", ");
  $("nightOn").checked = n.enabled;
  $("nightStart").value = n.start;
  $("nightEnd").value = n.end;
  $("nightAction").value = n.action;
  $("nightLevel").value = n.brightness;
  $("nightLevelValue").textContent = n.brightness;
}

async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.ok) render(await r.json());
  } catch (e) { $("status").textContent = t("disconnected"); $("status").className = "pill off"; }
}

function refreshPreview() {
  if (document.visibilityState !== "visible") return;
  const img = new Image();
  img.onload = () => ($("previewImg").src = img.src);
  img.src = "/screen.png?t=" + Date.now();
}

$("language").addEventListener("change", async (e) => {
  if (await action({ action: "language", language: e.target.value })) location.reload();
});
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => action({ action: "mode", mode: b.dataset.mode })));
$("power").addEventListener("change", (e) => action({ action: "power", on: e.target.checked }));
$("autostart").addEventListener("change", (e) => action({ action: "autostart", on: e.target.checked }));
$("brightness").addEventListener("input", (e) => ($("brightnessValue").textContent = e.target.value));
$("brightness").addEventListener("change", (e) => action({ action: "brightness", level: Number(e.target.value) }));
$("rotate").addEventListener("change", (e) => action({ action: "rotate", on: e.target.checked }));
$("applyTheme").addEventListener("click", () => action({ action: "theme", name: $("theme").value }));
$("useIgam3").addEventListener("click", () => action({ action: "theme", name: "iGam3" }));
$("saveTitle").addEventListener("click", () => action({ action: "title", title: $("title").value, tag: $("tag").value }));
$("setBg").addEventListener("click", async () => { if (await upload("background", $("bgFile"))) action({ action: "background" }); });
$("removeBg").addEventListener("click", () => action({ action: "background", remove: true }));
$("keepImage").addEventListener("click", async () => { if (await upload("image", $("imageFile"))) action({ action: "image", fill: $("fill").checked }); });

async function splash(keep) {
  const payload = { action: "splash", keep, title: $("sTitle").value, subtitle: $("sSub").value, footer: $("sFooter").value };
  for (const [slot, input] of [["logo", $("logoFile")], ["photo", $("photoFile")]]) {
    if (input.files[0]) { if (!(await upload(slot, input))) return; payload[slot] = true; }
  }
  if (await action(payload, t(keep ? "splashKept" : "splashPreview")) && !keep) {
    const img = $("splashImg");
    img.src = "/splash-preview.png?t=" + Date.now();
    img.style.display = "block";
  }
}
$("qrNow").addEventListener("click", () => action({ action: "qr_now" }));
$("previewSplash").addEventListener("click", () => splash(false));
$("keepSplash").addEventListener("click", () => splash(true));
$("savePw").addEventListener("click", () => {
  if ($("pw1").value !== $("pw2").value) { toast(t("pwMismatch"), false); return; }
  action({ action: "password", password: $("pw1").value }).then((ok) => { if (ok) { $("pw1").value = ""; $("pw2").value = ""; } });
});

// Vietnam Theme
function refreshVietnam() { $("vnPreview").src = "/vietnam-preview.png?t=" + Date.now(); }
$("vnUse").addEventListener("click", () => action({ action: "mode", mode: "vietnam" }));
$("vnSetLogo").addEventListener("click", async () => {
  if (await upload("themelogo", $("vnLogo")) && await action({ action: "theme_logo" })) setTimeout(refreshVietnam, 500);
});
$("vnNoLogo").addEventListener("click", async () => { if (await action({ action: "theme_logo", remove: true })) setTimeout(refreshVietnam, 500); });
refreshVietnam();
setInterval(() => { if (document.visibilityState === "visible") refreshVietnam(); }, 30000);

// Clock & weather, night, alerts
async function findCity() {
  const q = $("citySearch").value.trim();
  if (!q) return;
  const box = $("places");
  box.innerHTML = "";
  const r = await fetch("/api/places?q=" + encodeURIComponent(q), { cache: "no-store" });
  const res = await r.json();
  if (!res.ok) { toast(res.message, false); return; }
  if (!res.places.length) { toast(t("noPlace"), false); return; }
  res.places.forEach((place) => {
    const b = document.createElement("button");
    b.className = "btn ghost";
    b.textContent = [place.name, place.region, place.country].filter((x, i, all) => x && all.indexOf(x) === i).join(", ");
    b.addEventListener("click", async () => {
      if (await action({ action: "weather", name: place.name, latitude: place.latitude, longitude: place.longitude })) box.innerHTML = "";
    });
    box.appendChild(b);
  });
}
$("cityFind").addEventListener("click", findCity);
$("citySearch").addEventListener("keydown", (e) => { if (e.key === "Enter") findCity(); });
$("cityOff").addEventListener("click", () => action({ action: "weather", off: true }));
$("nightLevel").addEventListener("input", (e) => ($("nightLevelValue").textContent = e.target.value));
$("nightSave").addEventListener("click", () => action({ action: "night", enabled: $("nightOn").checked, start: $("nightStart").value,
  end: $("nightEnd").value, night_action: $("nightAction").value, brightness: Number($("nightLevel").value) }));
$("alertsSave").addEventListener("click", () => action({ action: "alerts", enabled: $("alertsOn").checked,
  temperature: Number($("alertTemp").value), disk: Number($("alertDisk").value), network: $("alertNet").checked,
  services: $("alertServices").value }));
$("alertsTest").addEventListener("click", () => action({ action: "alerts_test" }));
$("telegramConnect").addEventListener("click", async () => {
  if (await action({ action: "telegram_connect", token: $("botToken").value, chat: $("chatId").value.trim() })) {
    $("botToken").value = "";
    $("chatId").value = "";
  }
});
$("telegramTest").addEventListener("click", () => action({ action: "telegram_test" }));
$("telegramOff").addEventListener("click", () => action({ action: "telegram_off" }));

// Theme gallery
let themes = null, galleryView = location.hash === "#store" ? "store" : "installed", galleryLimit = 24;
const orientName = (o) => t(o === "landscape" ? "landscapeCap" : "portraitCap");

function themeCard(item, installed) {
  const card = document.createElement("div");
  const current = installed && themes.current === item.name;
  card.className = "tcard" + (current ? " current" : "");
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const safe = (url) => (/^https:\/\//.test(url || "") ? url : "");
  const src = installed ? `/theme-preview?name=${encodeURIComponent(item.name)}` : safe(item.preview);
  if (src) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.alt = item.name;
    img.src = src;
    img.onerror = () => { thumb.textContent = t("noPreview"); };
    thumb.appendChild(img);
  } else {
    thumb.textContent = t("noPreview");
  }
  card.appendChild(thumb);
  const name = document.createElement("div");
  name.className = "tname";
  name.title = item.name;
  name.textContent = item.name;
  if (installed && item.community) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = t("community");
    name.appendChild(badge);
  }
  card.appendChild(name);
  const meta = document.createElement("div");
  meta.className = "tmeta";
  meta.textContent = orientName(item.orientation) + (item.author ? " · " + t("by", item.author) : "");
  meta.title = meta.textContent;
  card.appendChild(meta);
  const actions = document.createElement("div");
  actions.className = "tactions";
  const main = document.createElement("button");
  main.className = "btn";
  if (installed) {
    main.textContent = t(current ? "inUse" : "use");
    main.disabled = current;
    main.addEventListener("click", async () => { await action({ action: "theme", name: item.name }); loadThemes(); });
  } else {
    main.textContent = t("getUse");
    main.addEventListener("click", async () => {
      toast(t("installing", item.name));
      await action({ action: "store_install", id: item.id });
      loadThemes();
    });
  }
  actions.appendChild(main);
  if (safe(item.discussion)) {
    const link = document.createElement("a");
    link.className = "btn ghost";
    link.href = safe(item.discussion);
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "↗";
    link.title = t("source");
    link.setAttribute("aria-label", t("source"));
    actions.appendChild(link);
  }
  if (installed && item.community && !current) {
    const remove = document.createElement("button");
    remove.className = "btn ghost";
    remove.textContent = t("removeTheme");
    remove.addEventListener("click", async () => {
      if (!confirm(t("removeConfirm", item.name))) return;
      await action({ action: "store_remove", id: item.id });
      loadThemes();
    });
    actions.appendChild(remove);
  }
  card.appendChild(actions);
  return card;
}

function renderGallery() {
  if (!themes) return;
  $("viewInstalled").textContent = t("viewInstalled", themes.installed.length);
  $("viewStore").textContent = t("viewStore", themes.store.length);
  document.querySelectorAll("#gallery .seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === galleryView)));
  $("galleryHint").innerHTML = t(galleryView === "installed" ? "installedHint" : "storeHint");
  const query = $("themeSearch").value.trim().toLowerCase();
  const orient = $("themeOrient").value;
  const list = (galleryView === "installed" ? themes.installed : themes.store).filter((item) =>
    (!orient || item.orientation === orient) &&
    (!query || item.name.toLowerCase().includes(query) || (item.author || "").toLowerCase().includes(query)));
  const grid = $("themeGrid");
  grid.innerHTML = "";
  if (!list.length) {
    const empty = document.createElement("p");
    empty.className = "hint";
    empty.textContent = t("noMatch");
    grid.appendChild(empty);
  }
  list.slice(0, galleryLimit).forEach((item) => grid.appendChild(themeCard(item, galleryView === "installed")));
  $("moreThemes").hidden = list.length <= galleryLimit;
  $("moreThemes").textContent = t("moreThemes", list.length - galleryLimit);
}

async function loadThemes() {
  try {
    const r = await fetch("/api/themes", { cache: "no-store" });
    if (r.ok) { themes = await r.json(); renderGallery(); }
  } catch (e) { /* the state refresh reports lost connections */ }
}

document.querySelectorAll("#gallery .seg button").forEach((b) => b.addEventListener("click", () => {
  galleryView = b.dataset.view;
  galleryLimit = 24;
  renderGallery();
}));
$("themeSearch").addEventListener("input", () => { galleryLimit = 24; renderGallery(); });
$("themeOrient").addEventListener("change", () => { galleryLimit = 24; renderGallery(); });
$("moreThemes").addEventListener("click", () => { galleryLimit += 24; renderGallery(); });
$("applyTheme").addEventListener("click", () => setTimeout(loadThemes, 500));

loadThemes();
refresh();
refreshPreview();
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 5000);
setInterval(refreshPreview, 2000);
</script>
